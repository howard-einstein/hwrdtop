[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwrdtop"
version = "0.1.0"
description = "A live Linux system and process monitor for the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "textual>=0.50"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hwrdtop = "hwrdtop.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
